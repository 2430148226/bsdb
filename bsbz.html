<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>数据管理页面</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { /* CSS Variables remain the same */
      --primary-color: #409EFF; --primary-hover-color: #66b1ff; --danger-color: #F56C6C;
      --danger-hover-color: #f89898; --border-color: #dcdfe6; --table-border-color: #ebeef5;
      --bg-color: #f2f6fc; --header-bg-color: #f5f7fa; --text-color: #303133;
      --secondary-text-color: #909399; --white: #fff; --box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    /* --- MODIFIED: html, body for full height layout --- */
    html, body {
      height: 100%; /* Allow child elements to use percentage heights based on viewport */
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden; /* Prevent accidental horizontal scrollbars on body */
    }
    /* body specific styles if any, otherwise it inherits from html */

    /* --- MODIFIED: .container to use flex and viewport height --- */
    .container {
      width: 90%;
      max-width: 1600px;
      margin: 20px auto; /* Top/bottom margin + auto for horizontal centering */
      background-color: var(--white);
      padding: 20px;
      border-radius: 4px;
      box-shadow: var(--box-shadow);

      display: flex;
      flex-direction: column;
      /* Calculate height to fill viewport MINUS its own vertical margins (20px top + 20px bottom = 40px) */
      height: calc(100vh - 40px);
      box-sizing: border-box; /* padding and border are included in the element's total width and height */
    }

    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0; /* MODIFIED: Prevent this section from shrinking when container space is tight */
    }

    .search-area { display: flex; align-items: center; gap: 10px; }
    .el-input { border: 1px solid var(--border-color); border-radius: 4px; padding: 8px 12px; font-size: 14px; width: 250px; }
    .el-button { border: none; border-radius: 4px; background-color: var(--primary-color); color: var(--white); padding: 9px 20px; font-size: 14px; cursor: pointer; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
    .el-button:hover { background-color: var(--primary-hover-color); }
    .el-button-primary { background-color: var(--primary-color); color: var(--white); }
    .el-button-primary:hover { background-color: var(--primary-hover-color); }
    .el-button-danger { background-color: var(--danger-color); color: var(--white); }
    .el-button-danger:hover { background-color: var(--danger-hover-color); }
    .el-button-default { background-color: var(--white); color: var(--text-color); border: 1px solid var(--border-color); }
    .el-button-default:hover { background-color: #ecf5ff; color: var(--primary-color); border-color: #c6e2ff; }

    .action-buttons-wrapper { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .action-button { padding: 5px 10px; font-size: 12px; margin-right: 0; }
    .action-buttons-wrapper .el-button { flex-shrink: 0; }

    /* --- MODIFIED: .table-wrapper to grow within flex container --- */
    .table-wrapper {
      /* max-height: 650px; */ /* You can keep this as a cap, or remove it if flex-grow is enough */
                                /* If kept, it will prevent the wrapper from exceeding 650px even if flex has more space */
      flex-grow: 1;          /* This makes the table wrapper take up available vertical space */
      overflow: auto;        /* Changed from overflow-y and -x to just overflow */
      border: 1px solid var(--table-border-color);
      border-radius: 4px;
      min-height: 250px;     /* Optional: Prevents the table wrapper from becoming too small */
                               /* (e.g., enough for ~5-6 rows of data before shrinking further) */
    }
    .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrapper::-webkit-scrollbar-track { background: var(--bg-color); }
    .table-wrapper::-webkit-scrollbar-thumb { background-color: #c1c1c1; border-radius: 4px; }

    .el-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: none; }
    .el-table th, .el-table td { border: 1px solid var(--table-border-color); padding: 12px; text-align: left; vertical-align: middle; word-wrap: break-word; font-size: 14px; }
    .el-table thead th { background-color: var(--header-bg-color); font-weight: bold; position: sticky; top: 0; z-index: 1; border-top: none; border-left: none; border-right: none; }
    .el-table thead th:first-child { border-left: none; }
    .el-table thead th:last-child { border-right: none; }
    .el-table tbody tr:last-child td { border-bottom: none; }
    .el-table tbody td:first-child { border-left: none; }
    .el-table tbody td:last-child { border-right: none; }
    .el-table tbody tr:hover { background-color: #f9f9f9; }
    .highlight { color: red; font-weight: bold; }
    .no-data-row td, .loading-row td { text-align: center; color: var(--secondary-text-color); height: 100px; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
    .modal-content { background-color: var(--white); margin: 10% auto; padding: 25px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 5px; box-shadow: var(--box-shadow); }
    .modal-header { padding-bottom: 15px; border-bottom: 1px solid var(--table-border-color); margin-bottom: 20px; font-size: 18px; font-weight: 600; position: relative; }
    .modal-body .form-group { margin-bottom: 15px; }
    .modal-body label { display: block; margin-bottom: 5px; font-weight: 500; }
    .modal-body input[type="text"], .modal-body textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    .modal-body textarea { min-height: 60px; resize: vertical; }
    .modal-footer { padding-top: 20px; border-top: 1px solid var(--table-border-color); margin-top: 20px; text-align: right; }
    .modal-footer .el-button { margin-left: 10px; }
    .close-button { color: #aaa; font-size: 28px; font-weight: bold; line-height: 1; position: absolute; right: 0px; top: -5px; cursor: pointer; }
    .close-button:hover, .close-button:focus { color: black; text-decoration: none; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <!-- Controls Section -->
    <div class="controls-section">
      <div class="search-area">
        <input type="text" id="searchInput" class="el-input" placeholder="请输入类型查询关键字">
        <button class="el-button el-button-primary" onclick="filterTable()">查询</button>
        <button class="el-button el-button-default" onclick="clearQuery()">清除</button>
      </div>
      <button class="el-button el-button-primary" onclick="openAddModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        添加
      </button>
    </div>

    <!-- Table Wrapper -->
    <div class="table-wrapper">
      <table class="el-table">
        <thead>
          <tr>
            <th style="width:8%;">工序</th>
            <th style="width:35%;">类型</th>
            <th style="width:15%;">单价</th>
            <th style="width:15%;">备注1</th>
            <th style="width:15%;">备注2</th>
            <th style="width:12%;">操作</th>
          </tr>
        </thead>
        <tbody id="dataTableBody">
           <tr id="loadingRow" class="loading-row" style="display: none;">
             <td colspan="6">
                <div class="loader"></div>
                <span>加载中...</span>
             </td>
           </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Modal (HTML remains the same) -->
  <div id="itemModal" class="modal">
     <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">添加新项目</span>
        <span class="close-button" onclick="closeModal()">×</span>
      </div>
      <div class="modal-body">
        <form id="itemForm">
          <input type="hidden" id="itemId">
          <div class="form-group">
            <label for="process">工序:</label>
            <input type="text" id="process" class="el-input" required>
          </div>
          <div class="form-group">
            <label for="type">类型:</label>
            <input type="text" id="type" class="el-input" required>
          </div>
          <div class="form-group">
            <label for="unit_price">单价:</label>
            <input type="text" id="unit_price" class="el-input">
          </div>
          <div class="form-group">
            <label for="remark1">备注1:</label>
            <textarea id="remark1" class="el-input"></textarea>
          </div>
          <div class="form-group">
            <label for="remark2">备注2:</label>
            <textarea id="remark2" class="el-input"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="el-button el-button-default" onclick="closeModal()">取消</button>
        <button type="button" id="saveButton" class="el-button el-button-primary" onclick="saveItem()">保存</button>
      </div>
    </div>
  </div>

 <script>
    // JavaScript remains the same as your last provided version
    // --- Supabase Config ---
    const SUPABASE_URL = 'https://kkisabzmyiouksfczsrt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtraXNhYnpteWlvdWtzZmN6c3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1NTY5NjcsImV4cCI6MjA2MTEzMjk2N30.s_euUCvAyH9LQ-N7Oh4OiG7uTgQWFvbhDt8dwHdObOI';
    let supabaseClient;
    const tableName = 'items';

    // --- State ---
    let allData = [];
    let currentFilter = '';
    let isLoading = false; // Track loading state

    // --- DOM Elements ---
    let tableBody, searchInput, itemModal, modalTitle, itemForm, itemIdInput, processInput, typeInput, unitPriceInput, remark1Input, remark2Input, loadingRow, saveButton, tableWrapper;

    // --- Helpers (sanitizeHTML, highlightKeyword, mergeCells - Unchanged) ---
    function sanitizeHTML(str) { if (str === null || str === undefined) return ''; const temp = document.createElement('div'); temp.textContent = str; return temp.innerHTML; }
    function highlightKeyword(originalText, keyword) { if (!keyword || !originalText) return sanitizeHTML(originalText); const escapedKeyword = keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); const reg = new RegExp(`(${escapedKeyword})`, 'gi'); const sanitizedOriginal = sanitizeHTML(originalText); const tempDiv = document.createElement('div'); tempDiv.innerHTML = sanitizedOriginal; const textToHighlight = tempDiv.textContent || ""; const highlightedText = textToHighlight.replace(reg, `<span class="highlight">$1</span>`); if (highlightedText !== textToHighlight) { return highlightedText; } return sanitizedOriginal; }
    function mergeCells() { if (!tableBody) return; const rows = Array.from(tableBody.querySelectorAll('tr')).filter(row => !row.classList.contains('no-data-row') && !row.classList.contains('loading-row')); if (rows.length < 2) return; let prevCellContent = null; let prevCellElement = null; let rowspan = 1; rows.forEach((row, index) => { const cell = row.querySelector('td:nth-child(1)'); if (!cell) return; cell.style.display = ''; cell.rowSpan = 1; const currentCellContent = cell.textContent.trim(); if (index > 0 && currentCellContent === prevCellContent && prevCellElement) { rowspan++; prevCellElement.rowSpan = rowspan; cell.style.display = 'none'; } else { prevCellContent = currentCellContent; prevCellElement = cell; rowspan = 1; } }); }

    // --- Loading State ---
    function showLoadingIndicator() {
        if (!loadingRow || !tableBody) return;
        console.log("Showing loading indicator.");
        isLoading = true;
        tableBody.innerHTML = '';
        loadingRow.style.display = 'table-row';
        tableBody.appendChild(loadingRow);
    }

    function hideLoadingIndicator() {
        if (!loadingRow) return;
        console.log("Hiding loading indicator.");
        isLoading = false;
        loadingRow.style.display = 'none';
    }

    function showNoDataRow(message = '暂无数据') {
        if (!tableBody) return;
        hideLoadingIndicator();
        tableBody.innerHTML = `<tr class="no-data-row"><td colspan="6">${sanitizeHTML(message)}</td></tr>`;
    }

    // --- Data Fetching (Optimized for Refresh) ---
    async function fetchData() {
        if (!supabaseClient) { console.error("Supabase client not initialized."); showNoDataRow('Supabase 客户端未初始化！'); return; }
        console.log("Fetching data...");
        showLoadingIndicator();
        try {
            const { data, error } = await supabaseClient
                .from(tableName)
                .select('*')
                .order('process', { ascending: true })
                .order('id', { ascending: true });
            if (error) throw error;
            console.log("Data fetched:", data ? data.length : 0, "items");
            allData = data || [];
            renderTable();
        } catch (error) {
             console.error('Error fetching data:', error);
             hideLoadingIndicator();
             showNoDataRow('获取数据失败: ' + error.message);
             allData = [];
        }
    }

    // --- Table Rendering (with Error Handling & Scroll Restoration) ---
    function renderTable() {
        if (!tableBody || !tableWrapper) { console.error("tableBody or tableWrapper not found for rendering."); return; }
        console.log("Attempting to render table...");
        hideLoadingIndicator();
        const scrollTop = tableWrapper.scrollTop;
        try {
            tableBody.innerHTML = '';
            const dataToRender = filterData(allData, currentFilter);
            if (dataToRender.length === 0) {
                showNoDataRow(currentFilter ? '无匹配数据' : '暂无数据，请尝试添加');
            } else {
                dataToRender.forEach(item => {
                    const row = document.createElement('tr');
                    row.dataset.id = item.id;
                    const processContent = sanitizeHTML(item.process || '');
                    const typeContent = highlightKeyword(item.type || '', currentFilter);
                    const unitPriceContent = sanitizeHTML(item.unit_price || '');
                    const remark1Content = sanitizeHTML(item.remark1 || '').replace(/\n/g, '<br>');
                    const remark2Content = sanitizeHTML(item.remark2 || '').replace(/\n/g, '<br>');
                    row.innerHTML = `
                        <td>${processContent}</td>
                        <td>${typeContent}</td>
                        <td>${unitPriceContent}</td>
                        <td>${remark1Content}</td>
                        <td>${remark2Content}</td>
                        <td>
                            <div class="action-buttons-wrapper">
                                <button class="el-button el-button-primary action-button" onclick="openEditModal(${item.id})">编辑</button>
                                <button class="el-button el-button-danger action-button" onclick="deleteItem(${item.id})">删除</button>
                            </div>
                        </td>`;
                    tableBody.appendChild(row);
                });
                mergeCells();
            }
            console.log("Table rendered successfully.");
             requestAnimationFrame(() => {
                 tableWrapper.scrollTop = scrollTop;
             });
        } catch (error) {
             console.error("Error during renderTable:", error);
             showNoDataRow('渲染表格时出错，请检查控制台！');
        }
    }

    // --- Filtering Logic (Unchanged) ---
    function filterData(data, keyword) {
        if (!keyword) { return data; }
        const lowerKeyword = keyword.toLowerCase();
        return data.filter(item => item.type && typeof item.type === 'string' && item.type.toLowerCase().includes(lowerKeyword));
    }

    // --- Search Functionality (Unchanged) ---
    window.filterTable = function() { if (!searchInput) return; currentFilter = searchInput.value.trim(); renderTable(); };
    window.clearQuery = function() { if (!searchInput) return; searchInput.value = ''; currentFilter = ''; renderTable(); };

    // --- Modal Handling (Unchanged) ---
    function openModal() { if(itemModal) itemModal.style.display = "block"; }
    function closeModal() { if(itemModal) itemModal.style.display = "none"; if(itemForm) itemForm.reset(); if(itemIdInput) itemIdInput.value = ''; }
    window.openAddModal = function() { if(modalTitle) modalTitle.textContent = '添加新项目'; if(itemForm) itemForm.reset(); if(itemIdInput) itemIdInput.value = ''; openModal(); };
    window.openEditModal = function(id) { const item = allData.find(d => d.id === id); if (!item) { console.error('Item not found:', id); alert('找不到项目！'); return; } if(!modalTitle || !itemIdInput || !processInput || !typeInput || !unitPriceInput || !remark1Input || !remark2Input) { console.error("Modal elements missing."); return; } modalTitle.textContent = '编辑项目'; itemIdInput.value = item.id; processInput.value = item.process || ''; typeInput.value = item.type || ''; unitPriceInput.value = item.unit_price || ''; remark1Input.value = item.remark1 || ''; remark2Input.value = item.remark2 || ''; openModal(); };
    window.onclick = function(event) { if (event.target == itemModal) { closeModal(); } }
    window.closeModal = closeModal;

    // --- CRUD Operations (Optimized for Local Update - Unchanged) ---
    window.saveItem = async function() {
        if (!supabaseClient || !saveButton) return;
        saveButton.disabled = true; saveButton.textContent = '保存中...';
        const id = itemIdInput.value;
        const itemData = { process: processInput.value.trim(), type: typeInput.value.trim(), unit_price: unitPriceInput.value.trim(), remark1: remark1Input.value.trim(), remark2: remark2Input.value.trim() };
        if (!itemData.process || !itemData.type) { alert('“工序”和“类型”字段不能为空！'); saveButton.disabled = false; saveButton.textContent = '保存'; return; }
        closeModal();
        console.log("Attempting to save item:", id ? "Update ID " + id : "Add New");
        try {
            let resultData;
            if (id) {
                const { data, error } = await supabaseClient.from(tableName).update(itemData).eq('id', id).select();
                if (error) throw error;
                resultData = data;
                console.log('Update successful, returned data:', resultData);
                const index = allData.findIndex(item => item.id == id);
                if (index !== -1 && resultData && resultData.length > 0) { allData[index] = resultData[0]; console.log("Local data updated at index:", index); }
                else { throw new Error("Failed to update local data after DB update."); }
            } else {
                const { data, error } = await supabaseClient.from(tableName).insert([itemData]).select();
                if (error) throw error;
                resultData = data;
                 console.log('Insert successful, returned data:', resultData);
                if (resultData && resultData.length > 0) {
                    allData.push(resultData[0]);
                    console.log("Local data added. New length:", allData.length);
                     allData.sort((a, b) => { const processCompare = (a.process || '').localeCompare(b.process || ''); if (processCompare !== 0) return processCompare; return (a.id || 0) - (b.id || 0); });
                } else { throw new Error("Failed to update local data after DB insert."); }
            }
            console.log("Calling renderTable after save success.");
            renderTable();
        } catch (err) {
            console.error('Error saving item:', err);
            alert(`保存失败: ${err.message}`);
        } finally {
            if (saveButton) { saveButton.disabled = false; saveButton.textContent = '保存'; }
            console.log("Save operation finished.");
        }
    };
    window.deleteItem = async function(id) {
        if (!supabaseClient) return;
        if (!confirm(`确定要删除 ID 为 ${id} 的项目吗？`)) return;
        console.log("Attempting to delete item:", id);
        try {
            const { error } = await supabaseClient.from(tableName).delete().eq('id', id);
            if (error) throw error;
            console.log('Delete successful from DB for ID:', id);
            const initialLength = allData.length;
            allData = allData.filter(item => item.id != id);
            if (allData.length < initialLength) { console.log("Local data updated after delete. New length:", allData.length); console.log("Calling renderTable after delete success."); renderTable(); }
            else { console.warn("Item ID", id, "not found in local data during delete. Data might be inconsistent. Fetching all."); await fetchData(); }
        } catch (err) {
             console.error('Error deleting item:', err);
             alert(`删除失败: ${err.message}`);
        } finally {
            console.log("Delete operation finished for ID:", id);
        }
    };

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
        console.log("DOM loaded.");
        tableBody = document.getElementById('dataTableBody');
        searchInput = document.getElementById('searchInput');
        itemModal = document.getElementById('itemModal');
        modalTitle = document.getElementById('modalTitle');
        itemForm = document.getElementById('itemForm');
        itemIdInput = document.getElementById('itemId');
        processInput = document.getElementById('process');
        typeInput = document.getElementById('type');
        unitPriceInput = document.getElementById('unit_price');
        remark1Input = document.getElementById('remark1');
        remark2Input = document.getElementById('remark2');
        loadingRow = document.getElementById('loadingRow');
        saveButton = document.getElementById('saveButton');
        tableWrapper = document.querySelector('.table-wrapper');

        if (!tableBody || !loadingRow || !itemModal || !searchInput || !saveButton || !tableWrapper) {
             console.error("Essential DOM elements missing. Check IDs and structure.");
             if (tableBody && loadingRow) { hideLoadingIndicator(); showNoDataRow("页面初始化失败，缺少关键元素。"); }
             else { alert("页面初始化失败，缺少关键元素。"); }
             return;
        }
        if(searchInput) searchInput.addEventListener('keyup', e => { if (e.key === "Enter") filterTable(); });
        else console.warn("Search input not found for keyup listener.");

        if (typeof supabase !== 'undefined' && typeof supabase.createClient === 'function') {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log("Supabase client initialized.");
                fetchData();
            } catch (error) { console.error("Supabase init error:", error); showNoDataRow('Supabase 客户端初始化失败！'); }
        } else { console.error("Supabase library not loaded."); showNoDataRow('Supabase 库加载失败！'); }
    });
  </script>
</body>
</html>
