<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; }
        .sticky-header-container { position: sticky; top: 0; z-index: 1020; background-color: #f8f9fa; padding-bottom: 5px; }
        .controls-container { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; }
        .table thead th { background-color: #e9ecef; position: sticky; z-index: 1010; }
        .day-col { min-width: 35px; max-width: 45px; }
        .table tfoot tr { font-weight: bold; background-color: #dee2e6; }
        .table th, .table td { vertical-align: middle; text-align: center; }
        .modal-body .form-group { margin-bottom: 1rem; }
        .person-selection-container { max-height: 150px; overflow-y: auto; border: 1px solid #ced4da; padding: 0.75rem; border-radius: 0.375rem; }
        .person-selection-container .form-check { margin-bottom: 0.5rem; }
        .person-selection-container label { font-weight: normal; }
        .data-cell:empty::before { content: ""; }
        .subtotal-label, .subtotal-value { color: red !important; font-weight: bold !important; }
        .subtotal-value:empty::before { content: ""; }
        /* 新增：加载动画容器样式 */
        #loadingIndicator {
            display: none; /* 默认隐藏 */
            text-align: center;
            padding: 40px 0; /* 增加上下内边距让动画更居中 */
        }

        /* ------------------ 打印样式开始 ------------------ */
        @media print {
            @page {
                size: A4 landscape; /* A4纸张，横向 */
                margin: 10mm;       /* 四周边距，可根据需要调整 */
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                font-size: 8pt; /* 稍微减小字体以容纳更多列 */
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                background-color: #fff !important; /* 确保打印背景为白色 */
            }

            /* 隐藏屏幕上固定定位的头部和模态框 */
            .sticky-header-container,
            .modal,
            .modal-backdrop {
                display: none !important;
            }

            /* 表格容器调整 */
            .table-responsive-container {
                overflow: visible !important; /* 确保表格内容不被裁剪 */
                margin-top: 0 !important; /* 移除屏幕上的边距 */
            }
            #dataTable {
                width: 100% !important;
                border-collapse: collapse !important;
                margin: 0 auto !important;
                padding: 0 !important;
                table-layout: auto; /* 让浏览器自动调整列宽，也可以尝试 'fixed' */
            }

            #dataTable thead th {
                position: static !important; /* 取消表头的sticky定位 */
                background-color: #f0f0f0 !important; /* 打印时给表头一个浅灰色背景 */
                color: #000 !important;
            }
             #dataTable thead {
                display: table-header-group !important; /* 确保表头每页重复 */
            }


            #dataTable tbody {
                display: table-row-group !important;
            }
            #dataTable tfoot {
                display: table-footer-group !important; /* 如果希望表尾也重复（通常不这样）*/
            }

            #dataTable tr {
                page-break-inside: avoid !important;
            }

            #dataTable th,
            #dataTable td {
                border: 1px solid #333 !important; /* 更清晰的打印边框 */
                padding: 2px 4px !important;     /* 减小内边距 */
                vertical-align: middle !important; /* 保持垂直居中 */
                text-align: center !important;   /* 保持文字居中 */
                word-wrap: break-word;
                page-break-inside: avoid !important;
                background-color: #fff !important; /* 确保单元格背景白色 */
                color: #000 !important;
            }
            
            /* 对于小计行，保持其特殊样式，但背景用白色 */
            #dataTable tr[data-category="小计"] td {
                font-weight: bold !important;
                color: red !important;
                background-color: #fff !important; /* 确保背景白色 */
            }

            /* 表尾合计行样式 */
            #dataTable tfoot tr {
                font-weight: bold !important;
                background-color: #f0f0f0 !important; /* 打印时给表尾一个浅灰色背景 */
                color: #000 !important;
            }

            /* 移除不必要的阴影、背景等屏幕效果 */
            * {
                box-shadow: none !important;
                text-shadow: none !important;
            }
        }
        /* ------------------ 打印样式结束 ------------------ */

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="sticky-header-container" id="stickyHeader">
    <div class="container-fluid py-1">
        <div class="controls-container">
            <div id="currentMonthInfo" style="font-size: 0.9rem;">
                <span class="fw-bold">当前月份: </span><span id="displaySelectedMonth">正在加载...</span>
            </div>
            <button class="btn btn-success btn-sm" id="openAddModalBtn" data-bs-toggle="modal" data-bs-target="#addEntryModalStatic" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-fill me-1" viewBox="0 0 16 16">
                  <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
                </svg>
                添加
            </button>
        </div>
    </div>
</div>

<div class="container-fluid mt-3 table-responsive-container">
    <!-- 新增：加载动画的HTML结构 -->
    <div id="loadingIndicator">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-2">数据加载中，请稍候...</p>
    </div>

    <table id="dataTable" class="table table-bordered table-striped table-hover">
        <thead id="headerRowContainer"><tr id="headerRow"></tr></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
    </table>
</div>

<div class="modal fade" id="addEntryModalStatic" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addEntryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addEntryModalLabel">添加记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group mb-3">
                    <label for="entryDate" class="form-label">选择日期:</label>
                    <input type="date" id="entryDate" name="entryDate" class="form-control" required>
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">选择人员:<span id="selectedPersonsCountText" class="ms-2 badge bg-secondary"></span></label>
                    <div class="person-selection-container">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAllPersons" name="selectAllPersons">
                            <label class="form-check-label fw-bold" for="selectAllPersons">全选/全不选</label>
                        </div>
                        <hr class="my-2">
                        <div id="modalPersonCheckboxes"></div>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="entryCategory" class="form-label">选择类别:</label>
                    <select id="entryCategory" name="entryCategory" class="form-select" required></select>
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">操作方式:</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="entryMode" id="modeAccumulateCoeff" value="accumulate" checked>
                            <label class="form-check-label" for="modeAccumulateCoeff">累加</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="entryMode" id="modeOverwriteCoeff" value="overwrite">
                            <label class="form-check-label" for="modeOverwriteCoeff">覆盖</label>
                        </div>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="entryValue" class="form-label" id="entryValueLabel">输入金额 (整数):</label>
                    <input type="text" id="entryValue" name="entryValue" class="form-control" placeholder="例如: 100 (留空表示清除/无)">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveAddEntryBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

<script>
    const SUPABASE_URL = 'https://kkisabzmyiouksfczsrt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtraXNhYnpteWlvdWtzZmN6c3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1NTY5NjcsImV4cCI6MjA2MTEzMjk2N30.s_euUCvAyH9LQ-N7Oh4OiG7uTgQWFvbhDt8dwHdObOI';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CURRENT_DEPARTMENT_NAME = "免拆模板";

    let currentDepartmentPersonnelMap = new Map();
    let personnelCoefficients = {};
    let currentDepartmentId = null;
    let loadedDailyData = {};

    const categories = ["正", "加", "计件", "补贴"];
    const timeBasedCategories = ["正", "加"];
    const amountBasedCategories = ["计件", "补贴"];
    const categoryKeysForSubtotal = { piecework: "计件", regular: "正", overtime: "加", subsidy: "补贴" };
    const subtotalCategoryName = "小计";

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;

    const headerRow = document.getElementById('headerRow');
    const tableBody = document.getElementById('tableBody');
    const tableFoot = document.getElementById('tableFoot');
    const stickyHeaderElement = document.getElementById('stickyHeader');
    const displaySelectedMonthEl = document.getElementById('displaySelectedMonth');
    const entryDateInput = document.getElementById('entryDate');
    const modalPersonCheckboxesContainer = document.getElementById('modalPersonCheckboxes');
    const entryCategorySelect = document.getElementById('entryCategory');
    const entryValueInput = document.getElementById('entryValue');
    const entryValueLabel = document.getElementById('entryValueLabel');
    const selectAllPersonsCheckbox = document.getElementById('selectAllPersons');
    const saveAddEntryBtn = document.getElementById('saveAddEntryBtn');
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    let addEntryModalInstance = null;

    // 新增：获取加载动画和表格元素的引用
    const loadingIndicator = document.getElementById('loadingIndicator');
    const dataTableElement = document.getElementById('dataTable');

    // --- MODIFICATION START (1/3): Declare variable to store last selected date ---
    let lastSelectedEntryDate = null;
    // --- MODIFICATION END (1/3) ---


    async function fetchDailyRecordsForMonth(departmentId, year, month) {
        const startDate = `${year}-${String(month).padStart(2, '0')}-01`;
        const daysInTargetMonth = getDaysInMonth(year, month);
        const endDate = `${year}-${String(month).padStart(2, '0')}-${String(daysInTargetMonth).padStart(2, '0')}`;
        console.log(`[${CURRENT_DEPARTMENT_NAME}] Fetching daily records for ${startDate} to ${endDate}`);
        let { data: records, error } = await supabaseClient.from('daily_records').select(`record_date,personnel_id,category_name,entry_value,personnel(name)`).eq('department_id', departmentId).gte('record_date', startDate).lte('record_date', endDate);
        if (error) { console.error(`[${CURRENT_DEPARTMENT_NAME}] Error fetching daily records:`, error); return {}; }
        const organizedData = {};
        records.forEach(record => {
            if (!record.personnel || !record.personnel.name) return;
            const personName = record.personnel.name;
            const day = new Date(record.record_date + 'T00:00:00Z').getUTCDate();
            if (!organizedData[personName]) organizedData[personName] = {};
            if (!organizedData[personName][record.category_name]) organizedData[personName][record.category_name] = {};
            organizedData[personName][record.category_name][day] = record.entry_value;
        });
        console.log(`[${CURRENT_DEPARTMENT_NAME}] Organized daily records:`, organizedData);
        return organizedData;
    }

    async function fetchDepartmentData() {
        if (!CURRENT_DEPARTMENT_NAME) { console.error("CURRENT_DEPARTMENT_NAME is not defined."); return false; }
        console.log(`[${CURRENT_DEPARTMENT_NAME}] Fetching data for department...`);
        try {
            let { data: department, error: depError } = await supabaseClient.from('department').select('id, name').eq('name', CURRENT_DEPARTMENT_NAME).single();
            if (depError) { console.error(`[${CURRENT_DEPARTMENT_NAME}] Supabase department query error:`, depError); throw depError; }
            if (!department) { alert(`未找到部门: ${CURRENT_DEPARTMENT_NAME}`); console.error(`[${CURRENT_DEPARTMENT_NAME}] Department not found.`); return false; }
            document.title = `${department.name} 信息表`;
            currentDepartmentId = department.id;

            let { data: personnel, error: persError } = await supabaseClient.from('personnel').select('id, name, coefficients').eq('department_id', department.id).eq('is_active', true);
            if (persError) { console.error(`[${CURRENT_DEPARTMENT_NAME}] Supabase personnel query error:`, persError); throw persError; }
            console.log(`[${CURRENT_DEPARTMENT_NAME}] Fetched personnel:`, personnel);
            currentDepartmentPersonnelMap.clear();
            personnelCoefficients = {};
            personnel.forEach(p => {
                currentDepartmentPersonnelMap.set(p.name, p.id);
                if (p.coefficients && p.coefficients.piece !== undefined && p.coefficients.zheng !== undefined && p.coefficients.jia !== undefined && p.coefficients.subsidy !== undefined) {
                    personnelCoefficients[p.name] = {
                        piece: parseFloat(p.coefficients.piece) || 0,
                        zheng: parseFloat(p.coefficients.zheng) || 0,
                        jia: parseFloat(p.coefficients.jia) || 0,
                        subsidy: parseFloat(p.coefficients.subsidy) || 0,
                    };
                } else {
                    console.warn(`[${CURRENT_DEPARTMENT_NAME}] 人员 "${p.name}" 没有配置完整的系数。小计将按0系数计算。`);
                    personnelCoefficients[p.name] = { piece: 0, zheng: 0, jia: 0, subsidy: 0 };
                }
            });
            if (currentDepartmentPersonnelMap.size === 0) console.warn(`[${CURRENT_DEPARTMENT_NAME}] No active personnel.`);

            loadedDailyData = await fetchDailyRecordsForMonth(currentDepartmentId, currentYear, currentMonth);
            return true;
        } catch (error) {
            console.error(`[${CURRENT_DEPARTMENT_NAME}] Error in fetchDepartmentData:`, error);
            alert(`[${CURRENT_DEPARTMENT_NAME}] 加载数据失败: ${error.message}`);
            return false;
        }
    }

    document.addEventListener('DOMContentLoaded', async function () {
        const modalElement = document.getElementById('addEntryModalStatic');
        if (modalElement) addEntryModalInstance = new bootstrap.Modal(modalElement);
        
        adjustStickyTableHeader();

        // 新增：显示加载动画并隐藏表格
        if (loadingIndicator && dataTableElement) {
            loadingIndicator.style.display = 'block';
            dataTableElement.style.display = 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('year') && urlParams.has('month')) {
            currentYear = parseInt(urlParams.get('year'));
            currentMonth = parseInt(urlParams.get('month'));
        }
        if (displaySelectedMonthEl) displaySelectedMonthEl.textContent = `${currentYear}年${String(currentMonth).padStart(2, '0')}月`;
        
        const dataLoaded = await fetchDepartmentData();

        // 新增：隐藏加载动画并显示表格 (无论成功或失败)
        if (loadingIndicator && dataTableElement) {
            loadingIndicator.style.display = 'none';
            dataTableElement.style.display = '';
        }

        if (!dataLoaded) {
            if (displaySelectedMonthEl) displaySelectedMonthEl.textContent = "数据加载失败";
            if (openAddModalBtn) openAddModalBtn.disabled = true;
            if (tableBody) {
                if(headerRow) headerRow.innerHTML = '';
                if(tableFoot) tableFoot.innerHTML = '';
                tableBody.innerHTML = `<tr><td colspan="1" style="text-align: center; color: red; font-weight: bold;">无法加载部门或人员数据。请检查网络或联系管理员。</td></tr>`;
            }
            return;
        }

        if (openAddModalBtn) openAddModalBtn.disabled = false;

        if (currentDepartmentPersonnelMap.size === 0) {
            if (tableBody) {
                 if(headerRow) headerRow.innerHTML = '';
                 if(tableFoot) tableFoot.innerHTML = '';
                tableBody.innerHTML = `<tr><td colspan="1" style="text-align: center;">此部门当前没有在职人员记录。</td></tr>`;
            }
        } else {
            renderTable();
        }
        populateModalForms();
        setupModalEventListeners();
    });

    function adjustStickyTableHeader() {
        if (stickyHeaderElement && document.querySelectorAll('#dataTable thead th').length > 0) {
            const headerHeight = stickyHeaderElement.offsetHeight;
            document.querySelectorAll('#dataTable thead th').forEach(th => {
                th.style.top = `${headerHeight}px`;
            });
        } else if (stickyHeaderElement) { 
             document.querySelectorAll('#dataTable thead th').forEach(th => {
                th.style.top = `0px`;
            });
        }
    }

    function getDaysInMonth(year, month) {
        return new Date(Date.UTC(year, month, 0)).getUTCDate();
    }

    function renderTable() {
        const year = currentYear;
        const month = currentMonth;
        const daysInMonth = getDaysInMonth(year, month);
        const allDisplayCategories = [...categories, subtotalCategoryName];

        headerRow.innerHTML = ''; tableBody.innerHTML = ''; tableFoot.innerHTML = '';
        let thName = document.createElement('th'); thName.textContent = '姓名'; headerRow.appendChild(thName);
        let thCategory = document.createElement('th'); thCategory.textContent = '类别'; headerRow.appendChild(thCategory);
        for (let day = 1; day <= daysInMonth; day++) { let thDay = document.createElement('th'); thDay.textContent = day; thDay.classList.add('day-col'); headerRow.appendChild(thDay); }
        let thTotal = document.createElement('th'); thTotal.textContent = '合计'; headerRow.appendChild(thTotal);

        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            let firstRowForPerson = true;
            allDisplayCategories.forEach(category => {
                const tr = document.createElement('tr');
                tr.dataset.person = name; tr.dataset.category = category;
                if (firstRowForPerson) {
                    const tdName = document.createElement('td'); tdName.textContent = name; tdName.rowSpan = allDisplayCategories.length; tr.appendChild(tdName);
                    firstRowForPerson = false;
                }
                const tdCategoryCell = document.createElement('td'); tdCategoryCell.textContent = category;
                if (category === subtotalCategoryName) tdCategoryCell.classList.add('subtotal-label');
                tr.appendChild(tdCategoryCell);

                for (let day = 1; day <= daysInMonth; day++) {
                    const tdDay = document.createElement('td'); tdDay.dataset.day = day; tdDay.classList.add('data-cell');
                    if (category === subtotalCategoryName) tdDay.classList.add('subtotal-value');
                    const personData = loadedDailyData[name];
                    if (personData && personData[category] && personData[category][day] !== undefined && personData[category][day] !== null) {
                        tdDay.textContent = formatDisplayValue(personData[category][day], timeBasedCategories.includes(category));
                    }
                    tr.appendChild(tdDay);
                }
                const tdTotalCell = document.createElement('td'); tdTotalCell.classList.add('row-total', 'data-cell');
                if (category === subtotalCategoryName) tdTotalCell.classList.add('subtotal-value');
                tr.appendChild(tdTotalCell);
                tableBody.appendChild(tr);
            });
        });
        const trGrandTotal = document.createElement('tr');
        const tdTotalLabel = document.createElement('td'); tdTotalLabel.textContent = '总合计'; tdTotalLabel.colSpan = 2; trGrandTotal.appendChild(tdTotalLabel);
        for (let day = 1; day <= daysInMonth; day++) { const tdDayGrandTotal = document.createElement('td'); tdDayGrandTotal.classList.add('grand-total-day', 'data-cell'); tdDayGrandTotal.dataset.day = day; trGrandTotal.appendChild(tdDayGrandTotal); }
        const tdOverallTotal = document.createElement('td'); tdOverallTotal.classList.add('grand-total-overall', 'data-cell'); trGrandTotal.appendChild(tdOverallTotal);
        tableFoot.appendChild(trGrandTotal);

        adjustStickyTableHeader();
        updateAllBaseCategoryTotals();
        updateSubtotals();
        updateGrandTotalRow();
    }

    function updateEntryValueInputType() {
        const selectedCategory = entryCategorySelect.value;
        if (timeBasedCategories.includes(selectedCategory)) {
            entryValueLabel.textContent = '输入时间 (可保留一位小数):';
            entryValueInput.placeholder = '例如: 7.5 (留空表示清除/无)';
        } else if (amountBasedCategories.includes(selectedCategory)) {
            entryValueLabel.textContent = '输入金额 (整数):';
            entryValueInput.placeholder = '例如: 100 (留空表示清除/无)';
        } else { // Should not happen with current categories array
            entryValueLabel.textContent = '输入值:';
            entryValueInput.placeholder = '(留空表示清除/无)';
        }
        entryValueInput.value = '';
        entryValueInput.type = 'text';
    }

    function setupModalEventListeners() {
        const modalElement = document.getElementById('addEntryModalStatic');
        if (modalElement) {
            modalElement.addEventListener('show.bs.modal', function () {
                // --- MODIFICATION START (2/3): Implement new date logic ---
                if (lastSelectedEntryDate) {
                    entryDateInput.value = lastSelectedEntryDate;
                } else {
                    // Default to current system date
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
                    const day = String(today.getDate()).padStart(2, '0');
                    entryDateInput.value = `${year}-${month}-${day}`;
                }
                // --- MODIFICATION END (2/3) ---

                // Reset other form fields
                const personCheckboxes = modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"]');
                personCheckboxes.forEach(cb => cb.checked = false);
                selectAllPersonsCheckbox.checked = false;
                selectAllPersonsCheckbox.indeterminate = false;
                if (entryCategorySelect.options.length > 0) entryCategorySelect.selectedIndex = 0;
                document.getElementById('modeAccumulateCoeff').checked = true; // Ensure this ID matches your radio button
                updateEntryValueInputType(); // This also clears entryValueInput.value
            });
        }
        entryCategorySelect.addEventListener('change', updateEntryValueInputType);
        saveAddEntryBtn.addEventListener('click', handleSaveEntry);
        selectAllPersonsCheckbox.addEventListener('change', handleSelectAllPersons);
    }

    function populateModalForms() {
        modalPersonCheckboxesContainer.innerHTML = '';
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            const div = document.createElement('div'); div.classList.add('form-check');
            const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.classList.add('form-check-input');
            checkbox.id = `person_${name.replace(/\s+/g, '_')}`; checkbox.value = name; checkbox.name = 'selectedPersons';
            checkbox.addEventListener('change', updateSelectAllCheckboxState);
            const label = document.createElement('label'); label.classList.add('form-check-label'); label.htmlFor = checkbox.id; label.textContent = name;
            div.appendChild(checkbox); div.appendChild(label);
            modalPersonCheckboxesContainer.appendChild(div);
        });
        entryCategorySelect.innerHTML = '';
        categories.forEach(category => {
            const option = document.createElement('option'); option.value = category; option.textContent = category;
            entryCategorySelect.appendChild(option);
        });
    }

    function handleSelectAllPersons(event) {
        const isChecked = event.target.checked;
        modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"][name="selectedPersons"]').forEach(cb => cb.checked = isChecked);
        selectAllPersonsCheckbox.indeterminate = false;
    }

    function updateSelectAllCheckboxState() {
        const personCbs = Array.from(modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"][name="selectedPersons"]'));
        if (personCbs.length === 0) { selectAllPersonsCheckbox.checked = false; selectAllPersonsCheckbox.indeterminate = false; return; }
        const allChecked = personCbs.every(cb => cb.checked);
        const someChecked = personCbs.some(cb => cb.checked);
        if (allChecked) { selectAllPersonsCheckbox.checked = true; selectAllPersonsCheckbox.indeterminate = false; }
        else if (someChecked) { selectAllPersonsCheckbox.checked = false; selectAllPersonsCheckbox.indeterminate = true; }
        else { selectAllPersonsCheckbox.checked = false; selectAllPersonsCheckbox.indeterminate = false; }
    }

    function formatDisplayValue(value, isTime = false, isSubtotalOrGrandTotal = false) {
        if (value === null || value === undefined || (typeof value === 'number' && isNaN(value))) return '';
        const num = Number(value);
        if (isSubtotalOrGrandTotal) { // Subtotals and grand totals are always integer amounts for display
            if (num === 0) return '';
            return String(Math.trunc(num)); // Use trunc for subtotals as per previous logic for this dept
        }
        // For regular data cells
        if (num === 0) return isTime ? '0.0' : ''; // Time shows '0.0', amount shows empty
        if (isTime) return num.toFixed(1); // Time to one decimal place
        return String(Math.round(num)); // Amounts rounded to integer
    }

    async function handleSaveEntry() {
        const selectedDateStr = entryDateInput.value;
        const selectedPersonsNames = Array.from(modalPersonCheckboxesContainer.querySelectorAll('input[name="selectedPersons"]:checked')).map(cb => cb.value);
        const selectedCategory = entryCategorySelect.value;
        const rawValueStr = entryValueInput.value.trim();
        let valueToStore = null;
        const entryMode = document.querySelector('input[name="entryMode"]:checked').value;

        if (!selectedDateStr || selectedPersonsNames.length === 0 || !selectedCategory) {
            alert("请确保已选择日期、至少一个人员和类别。"); return;
        }

        if (rawValueStr !== "") {
            if (timeBasedCategories.includes(selectedCategory)) {
                if (!/^\d*(\.\d{0,1})?\d*$/.test(rawValueStr) || parseFloat(rawValueStr) < 0) {
                    alert("请输入有效的正数时间 (例如: 7或7.5)，或留空以清除。"); return;
                }
                let parsedVal = parseFloat(rawValueStr);
                valueToStore = isNaN(parsedVal) ? null : parsedVal;
            } else if (amountBasedCategories.includes(selectedCategory)) {
                 if (!/^\d*$/.test(rawValueStr) || parseInt(rawValueStr, 10) < 0) {
                    alert("请输入有效的正整数金额，或留空以清除。"); return;
                }
                let parsedVal = parseInt(rawValueStr, 10);
                valueToStore = isNaN(parsedVal) ? null : parsedVal;
            } else {
                 alert("未知的类别输入类型!"); return; // Should not be reached if categories are well-defined
            }
        }

        const entryDateObj = new Date(selectedDateStr + "T00:00:00Z");
        const record_date_iso = entryDateObj.toISOString().split('T')[0];
        const entryDay = entryDateObj.getUTCDate();

        if (entryDateObj.getUTCFullYear() !== currentYear || (entryDateObj.getUTCMonth() + 1) !== currentMonth) {
             alert(`输入的日期 (${record_date_iso}) 不在当前表格显示的月份 (${currentYear}-${String(currentMonth).padStart(2,'0')})。`);
             return;
        }

        const recordsToUpsert = [];
        for (const personName of selectedPersonsNames) {
            const personnel_id = currentDepartmentPersonnelMap.get(personName);
            if (!personnel_id) continue;
            const targetRow = tableBody.querySelector(`tr[data-person="${personName}"][data-category="${selectedCategory}"]`);
            const dayCell = targetRow?.querySelector(`td[data-day="${entryDay}"]`);
            let finalValueToSave = valueToStore;

            if (entryMode === 'accumulate' && dayCell) {
                let currentValueInCell = parseFloat(dayCell.textContent);
                if (isNaN(currentValueInCell)) currentValueInCell = 0;
                if (valueToStore === null) {
                    finalValueToSave = (isNaN(currentValueInCell) || currentValueInCell === 0) ? null : currentValueInCell;
                } else {
                    finalValueToSave = currentValueInCell + valueToStore;
                }
            }
            if (dayCell) dayCell.textContent = formatDisplayValue(finalValueToSave, timeBasedCategories.includes(selectedCategory));
            if (!loadedDailyData[personName]) loadedDailyData[personName] = {};
            if (!loadedDailyData[personName][selectedCategory]) loadedDailyData[personName][selectedCategory] = {};
            loadedDailyData[personName][selectedCategory][entryDay] = finalValueToSave;

            recordsToUpsert.push({
                record_date: record_date_iso, personnel_id, department_id: currentDepartmentId,
                category_name: selectedCategory, entry_value: finalValueToSave
            });
        }

        if (recordsToUpsert.length > 0) {
            const originalButtonHTML = saveAddEntryBtn.innerHTML;
            saveAddEntryBtn.disabled = true;
            saveAddEntryBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 保存中...`;
            
            try {
                const { data, error } = await supabaseClient.from('daily_records').upsert(recordsToUpsert, { onConflict: 'record_date,personnel_id,category_name' }).select();
                if (error) { 
                    console.error(`[${CURRENT_DEPARTMENT_NAME}] Error saving:`, error); 
                    alert(`保存失败: ${error.message}`); 
                } else { 
                    console.log(`[${CURRENT_DEPARTMENT_NAME}] Saved:`, data); 
                }
            } catch (e) {
                 console.error(`[${CURRENT_DEPARTMENT_NAME}] Exception during upsert:`, e);
                 alert(`保存操作时发生网络或未知错误: ${e.message}`);
            } finally {
                saveAddEntryBtn.disabled = false;
                saveAddEntryBtn.innerHTML = originalButtonHTML;
            }
        }
        
        // --- MODIFICATION START (3/3): Remember the selected date after processing ---
        lastSelectedEntryDate = selectedDateStr;
        // --- MODIFICATION END (3/3) ---

        updateAllBaseCategoryTotals();
        updateSubtotals();
        updateGrandTotalRow();
        if(addEntryModalInstance) addEntryModalInstance.hide();
    }

    function updateSubtotals() { // Specific for 免拆模板 with coefficients
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            const coeffs = personnelCoefficients[name] || { piece: 0, zheng: 0, jia: 0, subsidy: 0 }; // Fallback if not found
            const subtotalRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="${subtotalCategoryName}"]`);
            if (!subtotalRow) { console.warn(`[${CURRENT_DEPARTMENT_NAME}] 未找到 ${name} 的小计行`); return; }

            const pieceCoeff = coeffs.piece;
            const zhengCoeff = coeffs.zheng;
            const jiaCoeff = coeffs.jia;
            const subsidyCoeff = coeffs.subsidy;

            const zhengRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="${categoryKeysForSubtotal.regular}"]`);
            const jiaRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="${categoryKeysForSubtotal.overtime}"]`);
            const pieceRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="${categoryKeysForSubtotal.piecework}"]`);
            const subsidyRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="${categoryKeysForSubtotal.subsidy}"]`);

            for (let day = 1; day <= daysInMonth; day++) {
                const v_zheng = zhengRow ? (parseFloat(zhengRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_jia = jiaRow ? (parseFloat(jiaRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_piece = pieceRow ? (parseFloat(pieceRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_subsidy = subsidyRow ? (parseFloat(subsidyRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                
                const subtotalDayCell = subtotalRow.querySelector(`td.subtotal-value[data-day="${day}"]`);
                if (subtotalDayCell) {
                    const calculatedDayValue = (v_piece * pieceCoeff) + (v_zheng * zhengCoeff) + (v_jia * jiaCoeff) + (v_subsidy * subsidyCoeff);
                    subtotalDayCell.textContent = formatDisplayValue(calculatedDayValue, false, true); // isSubtotalOrGrandTotal = true
                }
            }
            // Calculate monthly subtotal using the same logic on row totals
            const total_v_zheng = zhengRow ? (parseFloat(zhengRow.querySelector('td.row-total')?.textContent) || 0) : 0;
            const total_v_jia = jiaRow ? (parseFloat(jiaRow.querySelector('td.row-total')?.textContent) || 0) : 0;
            const total_v_piece = pieceRow ? (parseFloat(pieceRow.querySelector('td.row-total')?.textContent) || 0) : 0;
            const total_v_subsidy = subsidyRow ? (parseFloat(subsidyRow.querySelector('td.row-total')?.textContent) || 0) : 0;
            
            const personSubtotalMonthlyCalculated = (total_v_piece * pieceCoeff) + (total_v_zheng * zhengCoeff) + (total_v_jia * jiaCoeff) + (total_v_subsidy * subsidyCoeff);
            const subtotalMonthlyTotalCell = subtotalRow.querySelector('td.row-total.subtotal-value');
            if (subtotalMonthlyTotalCell) {
                subtotalMonthlyTotalCell.textContent = formatDisplayValue(personSubtotalMonthlyCalculated, false, true); // isSubtotalOrGrandTotal = true
            }
        });
    }

    function updateAllBaseCategoryTotals() {
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            categories.forEach(category => {
                const row = tableBody.querySelector(`tr[data-person="${name}"][data-category="${category}"]`);
                if (!row) return;
                let rowSum = 0;
                const isTimeCat = timeBasedCategories.includes(category);
                row.querySelectorAll('td[data-day]').forEach(cell => { rowSum += parseFloat(cell.textContent) || 0; });
                const rowTotalCell = row.querySelector('td.row-total');
                if (rowTotalCell) rowTotalCell.textContent = formatDisplayValue(rowSum, isTimeCat);
            });
        });
    }

    function updateGrandTotalRow() {
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        const grandTotalRow = tableFoot.querySelector('tr');
        if (grandTotalRow) {
            for (let day = 1; day <= daysInMonth; day++) {
                let sumForDayFromSubtotals = 0;
                Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
                    const subtotalDayCell = tableBody.querySelector(`tr[data-person="${name}"][data-category="${subtotalCategoryName}"] td.subtotal-value[data-day="${day}"]`);
                    if(subtotalDayCell) sumForDayFromSubtotals += (parseFloat(subtotalDayCell.textContent) || 0); // Parse as float for calculation
                });
                const grandTotalDayCell = grandTotalRow.querySelector(`td.grand-total-day[data-day="${day}"]`);
                if(grandTotalDayCell) grandTotalDayCell.textContent = formatDisplayValue(sumForDayFromSubtotals, false, true);
            }
            let overallGrandTotalValue = 0;
            Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
                const subtotalMonthlyCell = tableBody.querySelector(`tr[data-person="${name}"][data-category="${subtotalCategoryName}"] td.row-total.subtotal-value`);
                if(subtotalMonthlyCell) overallGrandTotalValue += (parseFloat(subtotalMonthlyCell.textContent) || 0); // Parse as float
            });
            const grandTotalOverallCell = grandTotalRow.querySelector('td.grand-total-overall');
            if(grandTotalOverallCell) grandTotalOverallCell.textContent = formatDisplayValue(overallGrandTotalValue, false, true);
        }
    }
    // --- 新增功能：集中处理已选人数显示 ---
function initializeSelectedCountFeature() {
    const countDisplaySpan = document.getElementById('selectedPersonsCountText');
    const checkboxesContainer = document.getElementById('modalPersonCheckboxes'); // 人员复选框的父容器
    const selectAllToggle = document.getElementById('selectAllPersons'); // “全选/全不选”复选框
    const modalInstance = document.getElementById('addEntryModalStatic'); // 模态框

    if (!countDisplaySpan || !checkboxesContainer || !selectAllToggle || !modalInstance) {
        console.error('计数功能所需的一个或多个元素未找到，功能可能无法正常工作。');
        if(countDisplaySpan) countDisplaySpan.textContent = '初始化错误';
        return;
    }

    // 核心的更新函数
    const updateCount = () => {
        // 确保在DOM更新完成后再获取状态
        setTimeout(() => {
            const selected = checkboxesContainer.querySelectorAll('input[name="selectedPersons"]:checked');
            countDisplaySpan.textContent = `已选 ${selected.length} 人`;
        }, 0); // 使用 setTimeout 0 将执行推迟到当前调用栈清空之后
    };

    // 1. 监听人员复选框容器的变化 (事件委托)
    // 当任何一个 name="selectedPersons" 的复选框状态改变时触发
    checkboxesContainer.addEventListener('change', (event) => {
        if (event.target && event.target.name === 'selectedPersons') {
            updateCount();
            // 原有的 updateSelectAllCheckboxState 应该会由这些复选框的change事件触发，
            // 它负责更新 selectAllToggle 的 indeterminate 状态。
        }
    });

    // 2. 监听“全选/全不选”复选框的变化
    selectAllToggle.addEventListener('change', () => {
        // 当全选框改变时，它的 'change' 事件会先触发，
        // 你的 handleSelectAllPersons 函数会执行（它会改变子复选框的状态）。
        // 然后我们的 updateCount 会执行。
        updateCount();
    });

    // 3. 监听模态框的 'shown.bs.modal' 事件
    // 'shown.bs.modal' 事件在模态框完全显示并且动画完成后触发
    // 这确保了所有在 'show.bs.modal' 期间发生的表单重置操作已经完成
    modalInstance.addEventListener('shown.bs.modal', () => {
        updateCount(); // 模态框打开后，更新一次计数（通常是0）
    });

    // 初始设置一次文本，以防万一（例如，如果模态框默认是打开的，虽然不常见）
    // 但主要依赖 shown.bs.modal
    updateCount();
}

// 确保在DOM完全加载后执行初始化
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeSelectedCountFeature);
} else {
    // DOMContentLoaded 已经发生
    initializeSelectedCountFeature();
}
// --- 新增功能代码结束 ---
</script>
