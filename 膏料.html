<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息表</title> <!-- 初始标题，会被JS更新 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sticky-header-container {
            position: sticky;
            top: 0;
            z-index: 1020;
            background-color: #f8f9fa;
            padding-bottom: 5px;
        }
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }

        .table thead th {
                background-color: #e9ecef;
                position: sticky;
                z-index: 1010;
            }
        .day-col { min-width: 35px; max-width: 45px; }
        .table tfoot tr { font-weight: bold; background-color: #dee2e6; }
        .table th, .table td { vertical-align: middle; text-align: center; }
        .modal-body .form-group { margin-bottom: 1rem; }
        .person-selection-container { max-height: 150px; overflow-y: auto; border: 1px solid #ced4da; padding: 0.75rem; border-radius: 0.375rem; }
        .person-selection-container .form-check { margin-bottom: 0.5rem; }
        .person-selection-container label { font-weight: normal; }
        .data-cell:empty::before { content: ""; }

        .subtotal-label strong {
            color: red;
            font-weight: bold;
        }
        tr[data-category="小计"] td {
            color: red !important;
            font-weight: bold !important;
        }
        tr[data-category="小计"] td:empty::before {
            content: "";
        }
        /* 新增：加载动画容器样式 */
        #loadingIndicator {
            display: none; /* 默认隐藏 */
            text-align: center;
            padding: 40px 0; /* 增加上下内边距让动画更居中 */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="sticky-header-container" id="stickyHeader">
    <div class="container-fluid py-1">
        <div class="controls-container">
            <div id="currentMonthInfo" style="font-size: 0.9rem;">
                <span class="fw-bold">当前月份: </span><span id="displaySelectedMonth">正在加载...</span>
            </div>

            <button class="btn btn-success btn-sm" id="openAddModalBtn" data-bs-toggle="modal" data-bs-target="#addEntryModalStatic" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-plus-circle-fill me-1" viewBox="0 0 16 16">
                  <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
                </svg>
                添加
            </button>
        </div>
    </div>
</div>

<div class="container-fluid mt-3 table-responsive-container">
    <div id="loadingIndicator">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-2">数据加载中，请稍候...</p>
    </div>

    <table id="dataTable" class="table table-bordered table-striped table-hover">
        <thead id="headerRowContainer">
            <tr id="headerRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
    </table>
</div>

<div class="modal fade" id="addEntryModalStatic" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addEntryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addEntryModalLabel">添加记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group mb-3">
                    <label for="entryDate" class="form-label">选择日期:</label>
                    <input type="date" id="entryDate" name="entryDate" class="form-control" required>
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">选择人员:</label>
                    <div class="person-selection-container">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAllPersons" name="selectAllPersons">
                            <label class="form-check-label fw-bold" for="selectAllPersons">全选/全不选</label>
                        </div>
                        <hr class="my-2">
                        <div id="modalPersonCheckboxes"></div>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="entryCategory" class="form-label">选择类别:</label>
                    <select id="entryCategory" name="entryCategory" class="form-select" required></select>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">操作方式:</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="entryMode" id="modeAccumulate" value="accumulate" checked>
                            <label class="form-check-label" for="modeAccumulate">累加</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="entryMode" id="modeOverwrite" value="overwrite">
                            <label class="form-check-label" for="modeOverwrite">覆盖</label>
                        </div>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label for="entryValue" class="form-label" id="entryValueLabel">输入金额 (整数):</label>
                    <input type="text" id="entryValue" name="entryValue" class="form-control" placeholder="例如: 100">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveAddEntryBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

<script>
    const SUPABASE_URL = 'https://kkisabzmyiouksfczsrt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtraXNhYnpteWlvdWtzZmN6c3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1NTY5NjcsImV4cCI6MjA2MTEzMjk2N30.s_euUCvAyH9LQ-N7Oh4OiG7uTgQWFvbhDt8dwHdObOI';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CURRENT_DEPARTMENT_NAME = "膏料车间";

    let currentDepartmentPersonnelMap = new Map();
    let currentDepartmentId = null;
    let departmentDefaultJishiRate = null;
    let loadedDailyData = {};

    const categories = ["计时", "计件", "装车", "补贴"];
    const timeBasedCategories = ["计时"];

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;

    const headerRow = document.getElementById('headerRow');
    const tableBody = document.getElementById('tableBody');
    const tableFoot = document.getElementById('tableFoot');
    const stickyHeaderElement = document.getElementById('stickyHeader');
    const displaySelectedMonthEl = document.getElementById('displaySelectedMonth');

    const entryDateInput = document.getElementById('entryDate');
    const modalPersonCheckboxesContainer = document.getElementById('modalPersonCheckboxes');
    const entryCategorySelect = document.getElementById('entryCategory');
    const entryValueInput = document.getElementById('entryValue');
    const entryValueLabel = document.getElementById('entryValueLabel');
    const selectAllPersonsCheckbox = document.getElementById('selectAllPersons');
    const saveAddEntryBtn = document.getElementById('saveAddEntryBtn');
    const openAddModalBtn = document.getElementById('openAddModalBtn');

    let addEntryModalInstance = null;

    const loadingIndicator = document.getElementById('loadingIndicator');
    const dataTableElement = document.getElementById('dataTable');

    // --- MODIFICATION START (1/3): Declare variable to store last selected date ---
    let lastSelectedEntryDate = null;
    // --- MODIFICATION END (1/3) ---


    async function fetchDailyRecordsForMonth(departmentId, year, month) {
        const startDate = `${year}-${String(month).padStart(2, '0')}-01`;
        const daysInTargetMonth = getDaysInMonth(year, month);
        const endDate = `${year}-${String(month).padStart(2, '0')}-${String(daysInTargetMonth).padStart(2, '0')}`;
        console.log(`[${CURRENT_DEPARTMENT_NAME}] Fetching daily records for ${startDate} to ${endDate}`);
        let { data: records, error } = await supabaseClient.from('daily_records')
            .select(`record_date, personnel_id, category_name, entry_value, personnel (name)`) // Ensure personnel(name) is selected
            .eq('department_id', departmentId)
            .gte('record_date', startDate)
            .lte('record_date', endDate);

        if (error) { console.error(`[${CURRENT_DEPARTMENT_NAME}] Error fetching daily records:`, error); return {}; }

        const organizedData = {};
        records.forEach(record => {
            // Directly use the joined personnel name, similar to 砂浆.html
            if (!record.personnel || !record.personnel.name) {
                console.warn(`[${CURRENT_DEPARTMENT_NAME}] Daily record found but personnel name could not be retrieved via join for personnel_id: ${record.personnel_id}. Record:`, record);
                return; // Skip this record if name is not available from join
            }
            const personName = record.personnel.name;

            const day = new Date(record.record_date + 'T00:00:00Z').getUTCDate();
            if (!organizedData[personName]) organizedData[personName] = {};
            if (!organizedData[personName][record.category_name]) organizedData[personName][record.category_name] = {};
            organizedData[personName][record.category_name][day] = record.entry_value;
        });
        console.log(`[${CURRENT_DEPARTMENT_NAME}] Organized daily records:`, organizedData);
        return organizedData;
    }


    async function fetchDepartmentData() {
        if (!CURRENT_DEPARTMENT_NAME) {
            console.error("当前页面的部门名称未定义 (CURRENT_DEPARTMENT_NAME)。");
            alert("页面配置错误，无法加载数据。");
            return false;
        }
        console.log("Fetching data for department:", CURRENT_DEPARTMENT_NAME);

        try {
            let { data: department, error: departmentError } = await supabaseClient
                .from('department')
                .select('id, name, default_jishi_rate')
                .eq('name', CURRENT_DEPARTMENT_NAME)
                .single();

            if (departmentError) {
                console.error("Supabase department query error:", departmentError);
                throw departmentError;
            }
            if (!department) {
                alert(`未在数据库中找到名为 "${CURRENT_DEPARTMENT_NAME}" 的部门。`);
                return false;
            }

            document.title = `${department.name} 信息表`;
            currentDepartmentId = department.id;
            if (department.default_jishi_rate !== null) {
                departmentDefaultJishiRate = parseFloat(department.default_jishi_rate);
            } else if (categories.includes("计时")) {
                 console.warn(`部门 "${department.name}" 有“计时”类别，但未配置 default_jishi_rate。将使用0。`);
                 departmentDefaultJishiRate = 0;
            }

            let { data: personnel, error: personnelError } = await supabaseClient
                .from('personnel')
                .select('id, name')
                .eq('department_id', department.id)
                .eq('is_active', true);

            if (personnelError) {
                 console.error("Supabase personnel query error:", personnelError);
                 throw personnelError;
            }

            currentDepartmentPersonnelMap.clear();
            personnel.forEach(p => currentDepartmentPersonnelMap.set(p.name, p.id)); // name -> id map


            if (currentDepartmentPersonnelMap.size === 0) {
                console.warn(`部门 "${department.name}" 没有配置在职人员。`);
            }

            loadedDailyData = await fetchDailyRecordsForMonth(currentDepartmentId, currentYear, currentMonth);

            return true;

        } catch (error) {
            console.error(`加载部门 "${CURRENT_DEPARTMENT_NAME}" 或其人员数据时出错:`, error);
            alert(`加载数据失败: ${error.message}`);
            return false;
        }
    }

    document.addEventListener('DOMContentLoaded', async function () {
        const modalElement = document.getElementById('addEntryModalStatic');
        if (modalElement) {
             addEntryModalInstance = new bootstrap.Modal(modalElement);
        }
        adjustStickyTableHeader();

        if (loadingIndicator && dataTableElement) {
            loadingIndicator.style.display = 'block';
            dataTableElement.style.display = 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const yearFromParent = urlParams.get('year');
        const monthFromParent = urlParams.get('month');

        if (yearFromParent && monthFromParent) {
            currentYear = parseInt(yearFromParent);
            currentMonth = parseInt(monthFromParent);
        }
         if (displaySelectedMonthEl) { // Ensure element exists before setting textContent
            displaySelectedMonthEl.textContent = `${currentYear}年${String(currentMonth).padStart(2, '0')}月`;
        }


        const dataLoaded = await fetchDepartmentData();

        if (loadingIndicator && dataTableElement) {
            loadingIndicator.style.display = 'none';
            dataTableElement.style.display = '';
        }

        if (!dataLoaded) {
            if (displaySelectedMonthEl) displaySelectedMonthEl.textContent = "数据加载失败";
            openAddModalBtn.disabled = true;
             if (tableBody) {
                if(headerRow) headerRow.innerHTML = '';
                if(tableFoot) tableFoot.innerHTML = '';
                tableBody.innerHTML = `<tr><td colspan="1" style="text-align: center; color: red; font-weight: bold;">无法加载部门或人员数据。请检查网络或联系管理员。</td></tr>`;
            }
            return;
        }
        openAddModalBtn.disabled = false;


        if (currentDepartmentPersonnelMap.size === 0) {
            console.warn("没有人员数据可供渲染。");
            if (tableBody) {
                 if(headerRow) headerRow.innerHTML = '';
                 if(tableFoot) tableFoot.innerHTML = '';
                const daysInMonth = getDaysInMonth(currentYear, currentMonth);
                const colspanValue = 2 + daysInMonth + 1; // name, category, days, total
                tableBody.innerHTML = `<tr><td colspan="${colspanValue}" style="text-align: center;">此部门当前没有在职人员记录。</td></tr>`;
            }
        } else {
            renderTable();
        }
        populateModalForms();
        setupModalEventListeners();
    });

    window.addEventListener('resize', adjustStickyTableHeader);

    function adjustStickyTableHeader() {
        if (stickyHeaderElement && document.querySelectorAll('#dataTable thead th').length > 0) {
            const headerHeight = stickyHeaderElement.offsetHeight;
            document.querySelectorAll('#dataTable thead th').forEach(th => {
                th.style.top = `${headerHeight}px`;
            });
        } else if (stickyHeaderElement) {
             document.querySelectorAll('#dataTable thead th').forEach(th => {
                th.style.top = `0px`;
            });
        }
    }

    function getDaysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
    }

    function renderTable() {
        const year = currentYear;
        const month = currentMonth;
        const daysInMonth = getDaysInMonth(year, month);

        headerRow.innerHTML = ''; tableBody.innerHTML = ''; tableFoot.innerHTML = '';

        let thName = document.createElement('th'); thName.scope = "col"; thName.textContent = '姓名'; headerRow.appendChild(thName);
        let thCategory = document.createElement('th'); thCategory.scope = "col"; thCategory.textContent = '类别'; headerRow.appendChild(thCategory);
        for (let day = 1; day <= daysInMonth; day++) {
            let thDay = document.createElement('th'); thDay.scope = "col"; thDay.textContent = day; thDay.classList.add('day-col'); headerRow.appendChild(thDay);
        }
        let thTotal = document.createElement('th'); thTotal.scope = "col"; thTotal.textContent = '合计'; headerRow.appendChild(thTotal);

        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            categories.forEach((category, categoryIndex) => {
                const tr = document.createElement('tr');
                tr.dataset.person = name;
                tr.dataset.category = category;

                if (categoryIndex === 0) {
                    const tdName = document.createElement('td');
                    tdName.textContent = name;
                    tdName.rowSpan = categories.length + 1; // +1 for subtotal row
                    tr.appendChild(tdName);
                }

                const tdCategory = document.createElement('td'); tdCategory.textContent = category; tr.appendChild(tdCategory);
                for (let day = 1; day <= daysInMonth; day++) {
                    const tdDay = document.createElement('td');
                    tdDay.dataset.day = day;
                    tdDay.classList.add('data-cell');
                    const personData = loadedDailyData[name];
                    if (personData && personData[category] && personData[category][day] !== undefined && personData[category][day] !== null) {
                        tdDay.textContent = formatDisplayValue(personData[category][day], timeBasedCategories.includes(category));
                    }
                    tr.appendChild(tdDay);
                }
                const tdTotal = document.createElement('td');
                tdTotal.classList.add('row-total', 'data-cell');
                tr.appendChild(tdTotal);
                tableBody.appendChild(tr);
            });

            // Add subtotal row for each person
            const trSubtotal = document.createElement('tr');
            trSubtotal.dataset.person = name;
            trSubtotal.dataset.category = '小计'; // Special category for styling and calculation

            const tdSubtotalCategory = document.createElement('td');
            tdSubtotalCategory.classList.add('subtotal-label');
            tdSubtotalCategory.innerHTML = '<strong>小计</strong>'; // Bold and potentially red text
            trSubtotal.appendChild(tdSubtotalCategory);

            for (let day = 1; day <= daysInMonth; day++) {
                const tdDaySubtotal = document.createElement('td');
                tdDaySubtotal.dataset.day = day; // For easy selection during calculation
                // tdDaySubtotal.classList.add('data-cell'); // if you want :empty styles
                trSubtotal.appendChild(tdDaySubtotal);
            }
            const tdSubtotalTotal = document.createElement('td');
            tdSubtotalTotal.classList.add('row-total'); // For easy selection and styling
            trSubtotal.appendChild(tdSubtotalTotal);
            tableBody.appendChild(trSubtotal);
        });

        // Grand Total Row
        const trGrandTotal = document.createElement('tr');
        const tdTotalLabel = document.createElement('td');
        tdTotalLabel.textContent = '总合计';
        tdTotalLabel.colSpan = 2; // Span Name and Category columns
        trGrandTotal.appendChild(tdTotalLabel);

        for (let day = 1; day <= daysInMonth; day++) {
            const tdDayGrandTotal = document.createElement('td');
            tdDayGrandTotal.classList.add('grand-total-day', 'data-cell');
            tdDayGrandTotal.dataset.day = day;
            trGrandTotal.appendChild(tdDayGrandTotal);
        }
        const tdOverallTotal = document.createElement('td');
        tdOverallTotal.classList.add('grand-total-overall', 'data-cell');
        trGrandTotal.appendChild(tdOverallTotal);
        tableFoot.appendChild(trGrandTotal);

        adjustStickyTableHeader();
        updateAllTotals();
    }

    function updateEntryValueInputType() {
        const selectedCategory = entryCategorySelect.value;
        if (timeBasedCategories.includes(selectedCategory)) {
            entryValueLabel.textContent = '输入时间 (可保留一位小数):';
            entryValueInput.placeholder = '例如: 7.5';
        } else {
            entryValueLabel.textContent = '输入金额 (整数):';
            entryValueInput.placeholder = '例如: 100';
        }
        entryValueInput.value = ''; // Clear input on category change
    }

    function setupModalEventListeners() {
        const modalElement = document.getElementById('addEntryModalStatic');
        if (modalElement) {
            modalElement.addEventListener('show.bs.modal', function () {
                // --- MODIFICATION START (2/3): Implement new date logic ---
                if (lastSelectedEntryDate) {
                    entryDateInput.value = lastSelectedEntryDate;
                } else {
                    // Default to current system date
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
                    const day = String(today.getDate()).padStart(2, '0');
                    entryDateInput.value = `${year}-${month}-${day}`;
                }
                // --- MODIFICATION END (2/3) ---

                // Reset other form fields
                const personCheckboxes = modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"]');
                personCheckboxes.forEach(cb => cb.checked = false);
                selectAllPersonsCheckbox.checked = false;
                selectAllPersonsCheckbox.indeterminate = false;

                if (entryCategorySelect.options.length > 0) {
                    entryCategorySelect.selectedIndex = 0;
                }
                document.getElementById('modeAccumulate').checked = true;
                updateEntryValueInputType(); // This will also clear entryValueInput
            });
        }
        entryCategorySelect.addEventListener('change', updateEntryValueInputType);
        saveAddEntryBtn.addEventListener('click', handleSaveEntry);
        selectAllPersonsCheckbox.addEventListener('change', function(event) {
            const isChecked = event.target.checked;
            const personCheckboxesInModal = modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"][name="selectedPersons"]');
            personCheckboxesInModal.forEach(checkbox => checkbox.checked = isChecked);
            selectAllPersonsCheckbox.indeterminate = false; // Reset indeterminate state
        });
    }

    function populateModalForms() {
        modalPersonCheckboxesContainer.innerHTML = '';
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            const div = document.createElement('div'); div.classList.add('form-check');
            const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.classList.add('form-check-input');
            checkbox.id = `person_${name.replace(/\s+/g, '_')}`; checkbox.value = name; checkbox.name = 'selectedPersons';
            checkbox.addEventListener('change', updateSelectAllCheckboxState); // Add listener to individual checkboxes
            const label = document.createElement('label'); label.classList.add('form-check-label'); label.htmlFor = checkbox.id; label.textContent = name;
            div.appendChild(checkbox); div.appendChild(label);
            modalPersonCheckboxesContainer.appendChild(div);
        });

        entryCategorySelect.innerHTML = '';
        categories.forEach(category => {
            const option = document.createElement('option'); option.value = category; option.textContent = category;
            entryCategorySelect.appendChild(option);
        });
    }

    function updateSelectAllCheckboxState() {
        const personCheckboxes = Array.from(modalPersonCheckboxesContainer.querySelectorAll('input[type="checkbox"][name="selectedPersons"]'));
        if (personCheckboxes.length === 0) { // Should not happen if personnel exist, but good check
            selectAllPersonsCheckbox.checked = false;
            selectAllPersonsCheckbox.indeterminate = false;
            return;
        }
        const allChecked = personCheckboxes.every(cb => cb.checked);
        const someChecked = personCheckboxes.some(cb => cb.checked);

        if (allChecked) {
            selectAllPersonsCheckbox.checked = true;
            selectAllPersonsCheckbox.indeterminate = false;
        } else if (someChecked) {
            selectAllPersonsCheckbox.checked = false; // Main checkbox itself is not checked
            selectAllPersonsCheckbox.indeterminate = true;
        } else { // None are checked
            selectAllPersonsCheckbox.checked = false;
            selectAllPersonsCheckbox.indeterminate = false;
        }
    }


    function formatDisplayValue(value, isTime = false, isSubtotalOrGrandTotal = false) {
        if (value === null || value === undefined || isNaN(Number(value))) return ''; // Handle null, undefined, NaN
        const num = Number(value);

        // For subtotals and grand totals, display as integer, blank if zero
        if (isSubtotalOrGrandTotal) {
            if (num === 0) return '';
            return String(Math.trunc(num)); // Use trunc to remove decimal part for totals
        }

        // For regular data cells
        if (num === 0 && !isTime) return ''; // Non-time, zero value means blank
        if (num === 0 && isTime) return '0.0'; // Time, zero value means '0.0'

        if (isTime) {
            return num.toFixed(1); // Time values to one decimal place
        }
        return String(Math.round(num)); // Other numeric values rounded to nearest integer
    }


    async function handleSaveEntry() {
        const selectedDateStr = entryDateInput.value;
        const selectedPersonNames = Array.from(modalPersonCheckboxesContainer.querySelectorAll('input[name="selectedPersons"]:checked')).map(cb => cb.value);
        const selectedCategory = entryCategorySelect.value;
        const rawValueStr = entryValueInput.value.trim();
        let valueToStore = null; // Default to null if input is empty, representing clear/no value

        const entryMode = document.querySelector('input[name="entryMode"]:checked').value;

        // Validations
        if (!selectedDateStr) { alert("请选择日期！"); return; }
        if (selectedPersonNames.length === 0) { alert("请至少选择一个人员！"); return; }
        if (!selectedCategory) { alert("请选择类别！"); return; }

        // Parse valueToStore based on category and input
        if (rawValueStr !== "") { // Only parse if there's input
            if (timeBasedCategories.includes(selectedCategory)) {
                valueToStore = parseFloat(rawValueStr);
                if (isNaN(valueToStore) || !/^\d*(\.\d{0,1})?\d*$/.test(rawValueStr) || valueToStore < 0) { // Allow empty before decimal like ".5"
                    alert("请输入有效的正数时间，例如 7 或 7.5！"); return;
                }
            } else { // For non-time categories (integers)
                valueToStore = parseInt(rawValueStr, 10);
                if (isNaN(valueToStore) || !/^\d+$/.test(rawValueStr) || valueToStore < 0) {
                    alert("请输入有效的正整数金额！"); return;
                }
            }
        } // If rawValueStr is empty, valueToStore remains null (for clearing or no entry)

        const entryDateObj = new Date(selectedDateStr + "T00:00:00Z"); // Use UTC context to avoid timezone shift for day
        const record_date_iso = entryDateObj.toISOString().split('T')[0]; // YYYY-MM-DD format for Supabase
        const entryDay = entryDateObj.getUTCDate(); // Get day in UTC


        // Check if the selected date is within the currently displayed month/year
        if (entryDateObj.getUTCFullYear() !== currentYear || (entryDateObj.getUTCMonth() + 1) !== currentMonth) {
            alert(`输入的日期 (${record_date_iso}) 不在当前表格显示的月份 (${currentYear}-${String(currentMonth).padStart(2,'0')})，数据未添加到当前视图。`);
            // Data will still be saved to DB if valid, just not shown immediately if out of view.
            // You might choose to still save, or prevent saving entirely here.
            // For now, let's assume we only update visually if it's in the current view, but still try to save.
            // Or, to prevent saving and only alert:
            // if(addEntryModalInstance) addEntryModalInstance.hide(); // Hide modal
            // return; // And stop further processing
        }

        const recordsToUpsert = [];
        selectedPersonNames.forEach(personName => {
            const personnel_id = currentDepartmentPersonnelMap.get(personName); // Get ID from name using the map
            if (!personnel_id) {
                console.error(`Could not find ID for person: ${personName}`);
                return; // Skip this person if ID not found
            }

            // Find the specific cell in the table to update visually
            const targetRow = tableBody.querySelector(`tr[data-person="${personName}"][data-category="${selectedCategory}"]`);
            const dayCell = targetRow?.querySelector(`td[data-day="${entryDay}"]`);
            let finalValueToSave = valueToStore; // Initialize with the parsed value (or null)

            if (entryMode === 'accumulate' && dayCell) {
                let currentValueInCell = parseFloat(dayCell.textContent); // Get current value from cell
                if (isNaN(currentValueInCell)) currentValueInCell = 0; // Default to 0 if cell is empty or non-numeric

                if (valueToStore === null) { // If new input is empty (clear/no value)
                    // Keep existing value if accumulating an empty value, unless you want 'empty' to clear it.
                    // For now, let's assume 'empty' means 'no change to accumulation'
                    finalValueToSave = (isNaN(currentValueInCell) || currentValueInCell === 0) ? null : currentValueInCell;
                } else {
                    finalValueToSave = currentValueInCell + valueToStore;
                }
            }
            // If mode is 'overwrite', finalValueToSave is already valueToStore (or null)

            // Update the cell display and local data cache
            // Only update visually if the date is within the current view (already checked above)
             if (dayCell && entryDateObj.getUTCFullYear() === currentYear && (entryDateObj.getUTCMonth() + 1) === currentMonth) {
                dayCell.textContent = formatDisplayValue(finalValueToSave, timeBasedCategories.includes(selectedCategory));
            }

            // Update loadedDailyData regardless of whether it's in current view,
            // so if user navigates to that month/year, data is pre-loaded
            if (!loadedDailyData[personName]) loadedDailyData[personName] = {};
            if (!loadedDailyData[personName][selectedCategory]) loadedDailyData[personName][selectedCategory] = {};
            loadedDailyData[personName][selectedCategory][entryDay] = finalValueToSave;


            recordsToUpsert.push({
                record_date: record_date_iso,
                personnel_id, // This should be the ID
                department_id: currentDepartmentId,
                category_name: selectedCategory,
                entry_value: finalValueToSave // Store the potentially modified value (accumulated or overwritten)
            });
        });

        if (recordsToUpsert.length > 0) {
            const originalButtonHTML = saveAddEntryBtn.innerHTML;
            saveAddEntryBtn.disabled = true;
            saveAddEntryBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 保存中...`;

            try {
                const { data, error } = await supabaseClient.from('daily_records').upsert(recordsToUpsert, { onConflict: 'record_date,personnel_id,category_name' }).select();
                if (error) {
                    console.error(`[${CURRENT_DEPARTMENT_NAME}] Error saving:`, error);
                    alert(`保存失败: ${error.message}`);
                } else {
                    console.log(`[${CURRENT_DEPARTMENT_NAME}] Saved:`, data);
                }
            } catch (e) {
                console.error(`[${CURRENT_DEPARTMENT_NAME}] Exception during upsert:`, e);
                alert(`保存操作时发生网络或未知错误: ${e.message}`);
            } finally {
                saveAddEntryBtn.disabled = false;
                saveAddEntryBtn.innerHTML = originalButtonHTML;
            }
        }

        // --- MODIFICATION START (3/3): Remember the selected date after processing ---
        lastSelectedEntryDate = selectedDateStr;
        // --- MODIFICATION END (3/3) ---

        updateAllTotals(); // Recalculate and display totals
        if(addEntryModalInstance) addEntryModalInstance.hide(); // Hide modal
    }

    function updateAllTotals() {
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        const JISHI_RATE_TO_USE = departmentDefaultJishiRate !== null ? departmentDefaultJishiRate : 0;

        // 1. Update row totals for each category for each person
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            categories.forEach(category => {
                const row = tableBody.querySelector(`tr[data-person="${name}"][data-category="${category}"]`);
                if (row) {
                    let rowSum = 0;
                    const isTimeCat = timeBasedCategories.includes(category);
                    const dayCells = row.querySelectorAll('td[data-day]');
                    dayCells.forEach(cell => {
                        rowSum += parseFloat(cell.textContent) || 0; // Sum up numeric content
                    });
                    const rowTotalCell = row.querySelector('td.row-total');
                    if (rowTotalCell) {
                        rowTotalCell.textContent = formatDisplayValue(rowSum, isTimeCat);
                    }
                }
            });
        });

        // 2. Update "小计" (Subtotal) row for each person (daily and monthly)
        Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
            const subtotalRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="小计"]`);
            if (!subtotalRow) {
                console.warn(`未找到 ${name} 的小计行`);
                return;
            }

            // Get references to the data rows for this person
            const jishiRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="计时"]`);
            const jijianRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="计件"]`);
            const zhuangcheRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="装车"]`);
            const butieRow = tableBody.querySelector(`tr[data-person="${name}"][data-category="补贴"]`);

            // Calculate daily subtotals
            for (let day = 1; day <= daysInMonth; day++) {
                const v_jishi = jishiRow ? (parseFloat(jishiRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_jijian = jijianRow ? (parseFloat(jijianRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_zhuangche = zhuangcheRow ? (parseFloat(zhuangcheRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;
                const v_butie = butieRow ? (parseFloat(butieRow.querySelector(`td[data-day="${day}"]`)?.textContent) || 0) : 0;

                const subtotalDayCell = subtotalRow.querySelector(`td[data-day="${day}"]`);
                if (subtotalDayCell) {
                    // Only calculate if there's any input for that day to avoid 0s everywhere
                    const sumOfRawInputsForDay = v_jishi + v_jijian + v_zhuangche + v_butie;
                    if (sumOfRawInputsForDay === 0) { // Check against raw inputs, not calculated values
                        subtotalDayCell.textContent = '';
                    } else {
                        const calculatedDayValue = v_jijian + (v_jishi * JISHI_RATE_TO_USE) + v_zhuangche + v_butie;
                        subtotalDayCell.textContent = formatDisplayValue(calculatedDayValue, false, true); // isTime=false, isSubtotalOrGrandTotal=true
                    }
                }
            }

            // Calculate monthly subtotal (row total for subtotal row)
            const subtotalMonthlyValueCell = subtotalRow.querySelector('td.row-total');
            if (subtotalMonthlyValueCell) {
                let monthlySubtotal = 0;
                // Sum of category row totals
                const total_jishi = jishiRow ? (parseFloat(jishiRow.querySelector('td.row-total')?.textContent) || 0) : 0;
                const total_jijian = jijianRow ? (parseFloat(jijianRow.querySelector('td.row-total')?.textContent) || 0) : 0;
                const total_zhuangche = zhuangcheRow ? (parseFloat(zhuangcheRow.querySelector('td.row-total')?.textContent) || 0) : 0;
                const total_butie = butieRow ? (parseFloat(butieRow.querySelector('td.row-total')?.textContent) || 0) : 0;

                monthlySubtotal = total_jijian + (total_jishi * JISHI_RATE_TO_USE) + total_zhuangche + total_butie;
                subtotalMonthlyValueCell.textContent = formatDisplayValue(monthlySubtotal, false, true);
            }
        });


        // 3. Update Grand Total row (sum of daily subtotals and monthly subtotals)
        const grandTotalRow = tableFoot.querySelector('tr');
        if (grandTotalRow) {
            // Daily grand totals
            for (let day = 1; day <= daysInMonth; day++) {
                let sumForDayFromSubtotals = 0;
                Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
                    const subtotalRowForPerson = tableBody.querySelector(`tr[data-person="${name}"][data-category="小计"]`);
                    if (subtotalRowForPerson) {
                        const subtotalDayCell = subtotalRowForPerson.querySelector(`td[data-day="${day}"]`);
                        sumForDayFromSubtotals += (parseFloat(subtotalDayCell?.textContent) || 0);
                    }
                });
                const grandTotalDayCell = grandTotalRow.querySelector(`td.grand-total-day[data-day="${day}"]`);
                if (grandTotalDayCell) {
                    grandTotalDayCell.textContent = formatDisplayValue(sumForDayFromSubtotals, false, true);
                }
            }

            // Overall grand total (sum of monthly subtotals)
            let overallGrandTotalValue = 0;
            Array.from(currentDepartmentPersonnelMap.keys()).forEach(name => {
                const subtotalRowForPerson = tableBody.querySelector(`tr[data-person="${name}"][data-category="小计"]`);
                if (subtotalRowForPerson) {
                    const subtotalMonthlyCell = subtotalRowForPerson.querySelector('td.row-total');
                    overallGrandTotalValue += (parseFloat(subtotalMonthlyCell?.textContent) || 0);
                }
            });

            const grandTotalOverallCell = grandTotalRow.querySelector('td.grand-total-overall');
            if (grandTotalOverallCell) {
                grandTotalOverallCell.textContent = formatDisplayValue(overallGrandTotalValue, false, true);
            }
        }
    }

</script>
